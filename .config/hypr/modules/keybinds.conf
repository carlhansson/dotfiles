###################
### KEYBINDINGS ###
###################
# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier
$ipc = qs -c noctalia-shell ipc call

# 1. APPLICATIONS
bind = $mainMod, Q, exec, uwsm app -- $terminal #"Terminal"
bind = $mainMod, E, exec, uwsm app -- $fileManager #"File manager"
bind = $mainMod, K, exec, uwsm app -- kitty --app-id=qalc-float -e qalc #"Calculator (qalc)"
bind = $mainMod, R, exec, uwsm app -- $ipc launcher toggle #"App launcher"
bind = $mainMod, X, exec, uwsm app -- $ipc launcher clipboard #"Clipboard history"
bind = $mainMod SHIFT, SPACE, exec, rofi-rbw #"Bitwarden (rofi-rbw)"

# 2. WINDOW MANAGEMENT
bind = $mainMod, C, killactive, #"Close window"
bind = $mainMod, F, fullscreen, #"Toggle fullscreen"
bind = $mainMod, left,  movewindow, l #"Move window left"
bind = $mainMod, right, movewindow, r #"Move window right"
bind = $mainMod, up,    movewindow, u #"Move window up"
bind = $mainMod, down,  movewindow, d #"Move window down"
binde = $mainMod SHIFT, left,  resizeactive, -50 0 #"Resize window left"
binde = $mainMod SHIFT, right, resizeactive,  50 0 #"Resize window right"
binde = $mainMod SHIFT, up,    resizeactive,  0 -50 #"Resize window up"
binde = $mainMod SHIFT, down,  resizeactive,  0  50 #"Resize window down"
bindm = $mainMod, mouse:272, movewindow #"Drag to move window"
bindm = $mainMod, mouse:273, resizewindow #"Drag to resize window"

# 3. WORKSPACES
bind = $mainMod, 1, workspace, 1 #"Workspace 1"
bind = $mainMod, 2, workspace, 2 #"Workspace 2"
bind = $mainMod, 3, workspace, 3 #"Workspace 3"
bind = $mainMod, 4, workspace, 4 #"Workspace 4"
bind = $mainMod, 5, workspace, 5 #"Workspace 5"
bind = $mainMod, 6, workspace, 6 #"Workspace 6"
bind = $mainMod, 7, workspace, 7 #"Workspace 7"
bind = $mainMod, 8, workspace, 8 #"Workspace 8"
bind = $mainMod, 9, workspace, 9 #"Workspace 9"
bind = $mainMod, 0, workspace, 10 #"Workspace 10"
bind = $mainMod SHIFT, 1, movetoworkspace, 1 #"Move to workspace 1"
bind = $mainMod SHIFT, 2, movetoworkspace, 2 #"Move to workspace 2"
bind = $mainMod SHIFT, 3, movetoworkspace, 3 #"Move to workspace 3"
bind = $mainMod SHIFT, 4, movetoworkspace, 4 #"Move to workspace 4"
bind = $mainMod SHIFT, 5, movetoworkspace, 5 #"Move to workspace 5"
bind = $mainMod SHIFT, 6, movetoworkspace, 6 #"Move to workspace 6"
bind = $mainMod SHIFT, 7, movetoworkspace, 7 #"Move to workspace 7"
bind = $mainMod SHIFT, 8, movetoworkspace, 8 #"Move to workspace 8"
bind = $mainMod SHIFT, 9, movetoworkspace, 9 #"Move to workspace 9"
bind = $mainMod SHIFT, 0, movetoworkspace, 10 #"Move to workspace 10"
bind = $mainMod, S, togglespecialworkspace, magic #"Toggle scratchpad"
bind = $mainMod SHIFT, S, movetoworkspace, special:magic #"Move to scratchpad"
bind = $mainMod, mouse_down, workspace, e+1 #"Next workspace"
bind = $mainMod, mouse_up, workspace, e-1 #"Previous workspace"

# 4. SYSTEM
bind = $mainMod, M, exec, uwsm stop #"Log out"
bind = $mainMod, L, exec, uwsm app -- $ipc lockScreen lock #"Lock screen"
bind = $mainMod, comma, exec, uwsm app -- $ipc settings toggle #"Open settings"

# 5. PANELS & SHELL
bind = $mainMod, W, exec, uwsm app -- $ipc wallpaper toggle #"Toggle wallpaper"
bind = $mainMod, N, exec, uwsm app -- $ipc network togglePanel #"Network panel"
bind = $mainMod, P, exec, uwsm app -- $ipc plugin openPanel network-manager-vpn #"VPN panel"
bind = $mainMod, B, exec, uwsm app -- $ipc bluetooth togglePanel #"Bluetooth panel"
bind = $mainMod SHIFT, K, exec, qs -c noctalia-shell ipc call plugin:keybind-cheatsheet toggle #"Keybind cheatsheet"

# 6. MEDIA
bindel = , XF86AudioRaiseVolume, exec, $ipc volume increase #"Volume up"
bindel = , XF86AudioLowerVolume, exec, $ipc volume decrease #"Volume down"
bindl = , XF86AudioMute, exec, $ipc volume muteOutput #"Mute output"
bindel = , XF86MonBrightnessUp, exec, $ipc brightness increase #"Brightness up"
bindel = , XF86MonBrightnessDown, exec, $ipc brightness decrease #"Brightness down"
bindl = , XF86AudioNext, exec, playerctl next #"Next track"
bindl = , XF86AudioPause, exec, playerctl play-pause #"Play/pause"
bindl = , XF86AudioPlay, exec, playerctl play-pause #"Play/pause"
bindl = , XF86AudioPrev, exec, playerctl previous #"Previous track"

# 7. SCREENSHOTS
bind = $mainMod, PRINT, exec, grim -g "$(slurp)" - | wl-copy #"Region screenshot to clipboard"
bind = $mainMod SHIFT, PRINT, exec, grim ~/Pictures/Screenshots/$(date +'%s_grim.png') #"Full screenshot to file"

# 8. DISPLAY
bind = $mainMod SHIFT, M, exec, hyprctl keyword monitor "HDMI-A-1,preferred,auto,1,mirror,eDP-1" #"Mirror HDMI to eDP-1"
bind = $mainMod SHIFT, E, exec, hyprctl keyword monitor "HDMI-A-1,preferred,auto,1" #"Extend HDMI display"