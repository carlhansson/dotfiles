[accessibility]
ui_scale = 0.85000000521540642

[bar.default]
background_opacity = 0.0
capsule = true
capsule_padding = 9.0
center = [ "media" ]
end = [ "privacy", "bluetooth", "network", "battery", "notifications", "control-center" ]
font_family = "JetBrainsMonoNL Nerd Font Mono"
font_weight = 600
margin_ends = 0
padding = 10
scale = 0.90000000596046448
start = [ "clock", "weather", "workspaces", "audio_visualizer" ]
thickness = 36

[calendar]
enabled = true

    [calendar.account.personal_google]
    name = "Google"
    type = "google"

[control_center.calendar]
show_week_numbers = true

[desktop_widgets]
enabled = false

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 800.0
    cy = 881.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

[notification]
history_retention_hours = 24

[osd]
position = "top_right"
scale = 0.90000000596046448

    [osd.kinds]
    media = false

[plugin_settings."noctalia/bitwarden"]
server_url = "https://vault.hesperia.dev"

[plugins]
enabled = [ "kenn/keybind-cheatsheet" ]

[shell]
app_icon_color = "on_surface"
corner_radius_scale = 0.80000001192092896
font_family = "JetBrainsMono NF"
launch_apps_as_systemd_services = true
password_style = "random"
telemetry_enabled = true

    [shell.launcher]
    compact = true

    [shell.mpris]
    blacklist = [ "zen" ]

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    wallpaper_placement = "floating"

    [shell.screenshot]
    directory = "/home/carl/Pictures/screenshots"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "command"
    command = "systemctl hibernate"
    countdown_seconds = 0.0
    enabled = true
    glyph = "hibernate"
    label = "Hibernate"
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "6"
    variant = "destructive"

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "hyprland", "qt" ]

        [theme.templates.user.hyprland]
        input_path = "~/.config/noctalia/templates/hyprland.lua"
        output_path = "~/.config/hypr/modules/colors.lua"

        [theme.templates.user.terminal-sequences]
        input_path = "~/.config/noctalia/templates/foot"
        output_path = "~/.config/foot/themes/foot"

        [theme.templates.user.yazi]
        input_path = "~/.config/noctalia/templates/yazi.toml"
        output_path = "~/.config/yazi/theme.toml"

[wallpaper]
directory = "/home/carl/Pictures/wallpapers"
transition = [ "fade" ]

    [wallpaper.default]
    path = "/home/carl/Pictures/wallpapers/a_lighthouse_on_a_dock_in_the_water.jpg"

    [wallpaper.last]
    path = "/home/carl/Pictures/wallpapers/a_lighthouse_on_a_dock_in_the_water.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/carl/Pictures/wallpapers/a_lighthouse_on_a_dock_in_the_water.jpg"

[weather]
refresh_minutes = 10

[widget.audio_visualizer]
bands = 32
interactive = false
mirrored = false

[widget.battery]
scale = 1.2000000000000002
show_label = false

[widget.bluetooth]
hide_when_no_connected_device = true

[widget.clock]
scale = 0.90000000000000002

[widget.media]
anchor = true
art_size = 20
hide_when_no_media = true
max_length = 350
scale = 0.90000000000000002
title_scroll = "on_hover"

[widget.network]
scale = 0.90000000000000002
show_vpn_label = true

[widget.privacy]
hide_inactive = true

[widget.volume]
show_label = false

[widget.weather]
scale = 0.90000000000000002

[widget.workspaces]
active_pill_size = 2.0
display = "none"
inactive_pill_size = 1.2
occupied_color = "outline"
show_labels = false
